# =====================================================================
# QA AI Assistant — Docker Compose
#
# Base de datos: GCP Cloud SQL (PostgreSQL) — configurada via .env
# Este compose solo levanta: Redis, Backend (FastAPI) y Celery Worker
#
# Uso:
#   cp .env.example .env   # Completar con credenciales GCP
#   docker-compose up -d
# =====================================================================

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - sessions_data:/tmp/qa-sessions
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      celery -A backend.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=celery
    env_file: .env
    volumes:
      - sessions_data:/tmp/qa-sessions
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------
  # celery_beat: si en el futuro se necesitan tareas programadas
  # celery_beat:
  #   build: { context: ., dockerfile: backend/Dockerfile }
  #   command: celery -A backend.tasks.celery_app beat --loglevel=info
  #   env_file: .env
  #   depends_on: { redis: { condition: service_healthy } }
  # ----------------------------------------------------------------

volumes:
  redis_data:
  sessions_data:
